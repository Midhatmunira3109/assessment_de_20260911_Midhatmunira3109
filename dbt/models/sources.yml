version: 2

sources:
  - name: raw
    description: "Raw weather data loaded directly from the Open-Meteo API."
    schema: raw
    tables:
      - name: weather_daily
        description: >
          One row per city per day. Loaded by pipeline/load.py using
          ON CONFLICT (city, date) DO NOTHING to guarantee idempotency.
        columns:
          - name: city
            description: "City name (e.g. London, Tokyo)."
            tests:
              - not_null

          - name: date
            description: "Calendar date of the measurement (UTC)."
            tests:
              - not_null

          - name: temp_max_c
            description: "Maximum 2 m air temperature in °C."

          - name: temp_min_c
            description: "Minimum 2 m air temperature in °C."

          - name: precipitation_mm
            description: "Total precipitation in mm."

          - name: windspeed_max_kmh
            description: "Maximum 10 m wind speed in km/h."

          - name: loaded_at
            description: "Timestamp when the row was inserted."
            tests:
              - not_null

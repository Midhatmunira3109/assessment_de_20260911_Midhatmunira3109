version: 2

models:
  - name: stg_weather_raw
    description: >
      Staging layer over raw.weather_daily. Applies explicit type casts,
      renames columns to snake_case, and adds a surrogate key. No business
      logic — this model is a pass-through cleaning step.
    columns:
      - name: weather_id
        description: "MD5 surrogate key derived from city + weather_date."
        tests:
          - unique
          - not_null

      - name: city
        description: "City name."
        tests:
          - not_null
          - accepted_values:
              values: ['London', 'New York', 'Tokyo', 'Sydney', 'Mumbai']

      - name: weather_date
        description: "Date of the weather observation (UTC)."
        tests:
          - not_null

      - name: temp_max_c
        description: "Maximum 2 m temperature in °C."

      - name: temp_min_c
        description: "Minimum 2 m temperature in °C."

      - name: precipitation_mm
        description: "Total daily precipitation in mm."

      - name: windspeed_max_kmh
        description: "Maximum 10 m wind speed in km/h."

      - name: loaded_at
        description: "Row insertion timestamp."
        tests:
          - not_null

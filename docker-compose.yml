x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-REPLACE_WITH_YOUR_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-supersecretkey}
    # Pipeline DB connection passed to DAG tasks
    PIPELINE_DB_HOST: postgres
    PIPELINE_DB_PORT: 5432
    PIPELINE_DB_NAME: weather
    PIPELINE_DB_USER: weather_user
    PIPELINE_DB_PASSWORD: weather_pass
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./pipeline:/opt/airflow/pipeline
    - ./dbt:/opt/airflow/dbt
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - weather-net

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    networks:
      - weather-net

  # ── Airflow Init ───────────────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    command: bash -c "airflow db migrate && airflow users create --username $${_AIRFLOW_WWW_USER_USERNAME:-admin} --password $${_AIRFLOW_WWW_USER_PASSWORD:-admin} --firstname Admin --lastname User --role Admin --email admin@example.com"
    restart: "no"

  # ── Airflow Webserver ──────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Airflow Scheduler ──────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  # ── JupyterLab ────────────────────────────────────────────────────────────
  jupyterlab:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    # Start as root so start.sh can chown the shared dbt dir (created by the
    # airflow container as UID 50000) to jovyan before the notebook runs.
    user: root
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-easy}
      CHOWN_EXTRA: "/home/jovyan/dbt"
      CHOWN_EXTRA_OPTS: "-R"
      PIPELINE_DB_HOST: postgres
      PIPELINE_DB_PORT: 5432
      PIPELINE_DB_NAME: weather
      PIPELINE_DB_USER: weather_user
      PIPELINE_DB_PASSWORD: weather_pass
    volumes:
      - ./notebooks:/home/jovyan/notebooks
      - ./pipeline:/home/jovyan/pipeline
      - ./dbt:/home/jovyan/dbt
    ports:
      - "8888:8888"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - weather-net

networks:
  weather-net:
    driver: bridge

volumes:
  postgres-data:
  airflow-logs:
